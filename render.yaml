databases:
  - name: evolution-db
    plan: starter
    databaseName: evolution_db
    user: evolution

services:
  - type: redis
    name: evolution-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: evolution-api-tsp
    plan: starter
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      # Server
      - key: SERVER_URL
        value: https://evolution-api-tsp.onrender.com
      - key: SERVER_PORT
        value: "8080"

      # Authentication
      - key: AUTHENTICATION_API_KEY
        generateValue: true
      - key: AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES
        value: "true"

      # Database - PostgreSQL (from Render managed database)
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_DATA_MESSAGE_UPDATE
        value: "true"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "true"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "true"
      - key: DATABASE_SAVE_DATA_LABELS
        value: "true"

      # Redis cache
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          name: evolution-redis
          type: redis
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "true"
      - key: CACHE_LOCAL_ENABLED
        value: "false"

      # WhatsApp
      - key: WHATSAPP_BAILEYS_DEFAULT
        value: "true"
      - key: QRCODE_LIMIT
        value: "10"

      # Instagram / Meta Business
      - key: WA_BUSINESS_TOKEN_WEBHOOK
        value: evolution
      - key: WA_BUSINESS_URL
        value: https://graph.facebook.com
      - key: WA_BUSINESS_VERSION
        value: v20.0

      # Webhook events
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "false"
      - key: WEBHOOK_EVENTS_QRCODE_UPDATED
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPSERT
        value: "true"
      - key: WEBHOOK_EVENTS_MESSAGES_UPDATE
        value: "true"
      - key: WEBHOOK_EVENTS_SEND_MESSAGE
        value: "true"
      - key: WEBHOOK_EVENTS_CONNECTION_UPDATE
        value: "true"

      # Logging
      - key: LOG_LEVEL
        value: "ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS"
